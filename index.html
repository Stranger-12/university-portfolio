<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Portfolio</title>
  </head>
  <body>
    <nav>
      <a href="#home">Home</a> |
      <a href="#about">About</a> |
      <a href="#work">Work</a> |
      <a href="#resume">Resume</a> |
      <a href="#contact">Contact</a>
    </nav>
    <section id="home">
      <h1>University Portfolio</h1>
      <img src="Images/handsome-young-cheerful-man-with-arms-crossed_171337-1073.avif" alt="student photo" width="300">
    </section>
    <section id="about">
      <h2>About</h2>
      <p>This section describes me as a student.</p>
      <video controls width="400">
        <source src="7969484-uhd_2160_3840_30fps" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </section>
    <section id="work">
      <h2>Work</h2>
      <p>Project 1: Example project.</p>
    </section>
    <section id="resume">
      <h2>Resume</h2>
      <table border="1">
        <tr>
          <th>Year</th>
          <th>Activity</th>
        </tr>
        <tr>
          <td>2024</td>
          <td>Example achievement</td>
        </tr>
      </table>
    </section>
    <section id="contact">
      <h2>Contact</h2>
      <form action="#" method="post">
        <div>
          <label for="name">Name:</label><br>
          <input type="text" id="name" name="name" placeholder="Your Name">
        </div>
        <div>
          <label for="email">Email:</label><br>
          <input type="email" id="email" name="email" placeholder="Your Email">
        </div>
        <div>
          <label for="message">Message:</label><br>
          <textarea id="message" name="message" rows="4" placeholder="Your Message"></textarea>
        </div>
        <div>
          <input type="submit" value="Send">
        </div>
      </form>
    </section>
    <footer>
      <p>© 2026 University Portfolio</p>
    </footer>
  </body>
</html>
